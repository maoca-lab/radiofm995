name: Build Android APK (Cloud CI/CD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: 雲端極速單元測試 (確保領域邏輯正確)
  test-core-logic:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定雲端 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝測試工具
        run: |
          python -m pip install --upgrade pip
          pip install pytest kivy

      - name: 執行純邏輯單元測試 (含根目錄路徑保護)
        run: |
          PYTHONPATH=. pytest tests/

  # Job 2: 使用 Kivy 官方 Action 進行 Android APK 打包
  build-apk:
    needs: test-core-logic
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 呼叫 Kivy 官方 Buildozer Action 打包
        uses: kivy/buildozer-action@v1
        with:
          command: buildozer -v android debug
          buildozer_version: stable

      - name: 上傳 APK 成品至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InkRadio-Android-APK
          path: bin/*.apk
