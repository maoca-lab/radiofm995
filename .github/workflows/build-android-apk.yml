name: Build Android APK (Cloud CI/CD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: 雲端極速單元測試
  test-core-logic:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定雲端 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝測試工具
        run: |
          python -m pip install --upgrade pip
          pip install pytest kivy

      - name: 執行純邏輯單元測試
        run: |
          pytest tests/

  # Job 2: 雲端 Android APK 編譯打包
  build-apk:
    needs: test-core-logic
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定雲端 Python 並鎖定相容的 Cython 版本
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝 Buildozer 與指定相容版本的 Cython
        run: |
          python -m pip install --upgrade pip
          pip install "Cython==0.29.33" buildozer

      - name: 使用 Buildozer 雲端編譯 APK
        uses: ArtemSydoryk/buildozer-action@v1
        with:
          workdir: .
          buildozer_version: master

      - name: 上傳 APK 成品至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InkRadio-Android-APK
          path: bin/*.apk
