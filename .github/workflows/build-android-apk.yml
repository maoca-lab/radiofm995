name: Build Android APK (Cloud CI/CD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: 雲端極速純邏輯單元測試 (10秒內全綠燈)
  test-core-logic:
    runs-on: ubuntu-22.04
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定雲端 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝測試工具
        run: |
          python -m pip install --upgrade pip
          pip install pytest kivy

      - name: 執行純邏輯單元測試
        run: |
          PYTHONPATH=. pytest tests/

  # Job 2: 原生雲端 Android APK 編譯打包
  build-apk:
    needs: test-core-logic
    runs-on: ubuntu-22.04
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定雲端 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 設定 Java 17 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安裝 Ubuntu C/C++ 編譯依賴與工具鏈
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip patchelf autoconf libtool pkg-config

      - name: 安裝 Buildozer 與相容版 Cython
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "Cython==0.29.33" buildozer

      - name: 執行 Buildozer 打包指令
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          buildozer -v android debug

      - name: 上傳 APK 成品至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InkRadio-Android-APK
          path: bin/*.apk
